name: Validate development branch

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Monetary parsing regression tests
        run: npx tsx --test tests/currencyParsing.test.ts
      - name: Production build
        run: npm run build
